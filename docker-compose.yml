services:
  mongodb:
    image: mongo:8
    container_name: experiment7-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - hotel-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: experiment7-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/hotelBooking
      CLIENT_ORIGIN: http://localhost:8081
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - hotel-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: experiment7-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - hotel-network

volumes:
  mongodb_data:

networks:
  hotel-network:
    driver: bridge


