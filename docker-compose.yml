services:
  mongodb:
    image: mongo:8
    container_name: experiment9-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - experiment9-network

  backend:
    build:
      context: ./backend
    container_name: experiment9-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/hotel_booking
      CLIENT_ORIGIN: http://localhost:8082
      JWT_SECRET: "YRVTGWLIKWXJDIDPMRIQVJJFPADAWUIELQSYUQFPNMCFVJWW"
    ports:
      - '5002:5000'
    depends_on:
      - mongodb
    networks:
      - experiment9-network

  frontend:
    build:
      context: .
    container_name: experiment9-frontend
    restart: unless-stopped
    ports:
      - '8082:80'
    depends_on:
      - backend
    networks:
      - experiment9-network

volumes:
  mongodb_data:

networks:
  experiment9-network:
    driver: bridge



